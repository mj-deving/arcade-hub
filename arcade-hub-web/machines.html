<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>">
    <title>Arcade Hub — Machines</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="sidebar-overlay"></div>

<!-- Sidebar -->
<nav id="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-joystick brand-icon"></i>
        <div><h5>Arcade Hub</h5></div>
    </div>

    <ul class="nav flex-column mt-3">
        <li class="nav-item">
            <a href="dashboard.html" class="nav-link">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a href="machines.html" class="nav-link active">
                <i class="bi bi-joystick"></i> Machines
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <div class="d-flex align-items-center justify-content-between">
            <div>
                <i class="bi bi-person-circle me-1"></i>
                <span class="user-name" id="sidebar-user">&mdash;</span>
            </div>
            <button class="btn btn-sm btn-link text-secondary p-0" onclick="logout()" title="Sign out">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>
    </div>
</nav>

<!-- Main content -->
<div id="main-content">
    <button id="hamburger" class="btn btn-sm btn-outline-secondary mb-3" title="Toggle sidebar">
        <i class="bi bi-list"></i>
    </button>

    <div class="page-header d-flex align-items-start justify-content-between">
        <div>
            <h1><i class="bi bi-joystick me-2"></i>Machines</h1>
            <div class="subtitle d-flex align-items-center gap-3">
                <span id="last-refreshed">Loading&hellip;</span>
                <span id="machine-count"></span>
                <span class="connection-status">
                    <span class="connection-dot disconnected" id="ws-status-dot"></span>
                    <span id="ws-status-text">Connecting&hellip;</span>
                </span>
            </div>
        </div>
        <button class="btn btn-sm btn-outline-warning" id="refresh-btn" title="Refresh now">
            <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <select class="form-select form-select-sm" id="status-filter" style="max-width:200px;">
            <option value="">All Statuses</option>
            <option value="ONLINE">Online</option>
            <option value="OFFLINE">Offline</option>
            <option value="MAINTENANCE">Maintenance</option>
            <option value="ERROR">Error</option>
        </select>
    </div>

    <!-- Machine table -->
    <div class="card-custom">
        <div class="table-responsive">
            <table class="table table-sm table-hover table-custom mb-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Location</th>
                        <th>Last Heartbeat</th>
                    </tr>
                </thead>
                <tbody id="machine-table-body">
                    <tr>
                        <td colspan="5">
                            <div class="loading-spinner">
                                <div class="spinner-border spinner-border-sm me-2"></div> Loading&hellip;
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/websocket.js"></script>
<script src="js/machines.js"></script>
</body>
</html>
