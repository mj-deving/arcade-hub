stages:
  - build
  - test
  - package

variables:
  MAVEN_CLI_OPTS: "-s .m2/settings.xml -DskipTests"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository/
    - target/

build_server:
  stage: build
  image: maven:3.8.7-openjdk-17
  script:
    - mvn clean compile -pl arcade-hub-server
  artifacts:
    paths:
      - arcade-hub-server/target/
    expire_in: 1 hour

build_simulator:
  stage: build
  image: maven:3.8.7-openjdk-17
  script:
    - mvn clean compile -pl arcade-hub-simulator
  artifacts:
    paths:
      - arcade-hub-simulator/target/
    expire_in: 1 hour

test_server:
  stage: test
  image: maven:3.8.7-openjdk-17
  script:
    - mvn test -pl arcade-hub-server
  dependencies:
    - build_server

test_simulator:
  stage: test
  image: maven:3.8.7-openjdk-17
  script:
    - mvn test -pl arcade-hub-simulator
  dependencies:
    - build_simulator

package:
  stage: package
  image: maven:3.8.7-openjdk-17
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - arcade-hub-server/target/*.jar
      - arcade-hub-simulator/target/*.jar
      - arcade-hub-web/
    expire_in: 30 days
  only:
    - main
    - tags
